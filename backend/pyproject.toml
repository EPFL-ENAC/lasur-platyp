[project]
name = "platyp-api"
version = "1.0.1"
description = ""
authors = [{ name = "ymarcon", email = "yannick.marcon@epfl.ch" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115.4,<0.116",
    "enacit4r-auth",
    "enacit4r-sql",
    "alembic>=1.14.0,<2",
    "asyncpg>=0.30.0,<0.31",
    "psycopg2>=2.9.10,<3",
    "pydantic-settings>=2.6.1,<3",
    "dynaconf>=3.2.6,<4",
    "python-multipart>=0.0.18,<0.0.19",
    "python-dotenv[cli]>=1.0.1,<2",
    "uvicorn>=0.32.0,<0.33",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2.3,<3",
    "h3>=4.3.1,<5",
    "geojson-pydantic>=2.1.0,<3",
    "shapely>=2.1.2,<3",
    "slowapi>=0.1.9,<0.2",
    "matplotlib>=3.10.8,<4",
    "geopandas>=1.1.3,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1,<10",
    "pytest-asyncio>=1.3.0,<2",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
enacit4r-auth = { git = "https://github.com/EPFL-ENAC/enacit4r-auth", rev = "0.6.1" }
enacit4r-sql = { git = "https://github.com/EPFL-ENAC/enacit4r-sql", rev = "0.4.1" }

[tool.uv.build-backend]
module-name = ["api"]
module-root = ""
namespace = true
source-include = ["api/data/*.yaml"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
